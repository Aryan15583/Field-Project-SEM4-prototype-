<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Codeingo</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { --bg: #ffffff; --ink: #111827; --muted: #4b5563; --primary: #1d6ff2; --line: #dbe4f3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --ink: #e5e7eb; --muted: #9ca3af; --primary: #22c55e; --line: #1f2937; } }
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 600 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
  .card { max-width: 380px; border: 2px solid var(--line); border-radius: 24px; padding: 32px 24px; }
  .logo { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 16px; background: var(--primary); }
  h1 { font-size: 24px; margin: 20px 0 8px; font-weight: 900; }
  p { color: var(--muted); margin: 0 0 24px; }
  a { display: inline-block; background: var(--primary); color: #fff; text-decoration: none; font-weight: 800; text-transform: uppercase; padding: 12px 24px; border-radius: 16px; }
</style>
</head>
<body>
  <main class="card">
    <span class="logo" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 64 64"><path d="M24 20l-10 12 10 12M40 20l10 12-10 12" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <h1>You're offline</h1>
    <p>Codeingo needs a connection to load lessons and save your progress. Check your internet and try again.</p>
    <a href="/learn">Try again</a>
  </main>
</body>
</html>
