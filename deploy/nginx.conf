# Edge reverse proxy: /api -> FastAPI, everything else -> Next.js.
# Layer-7 flood protection lives here (cheap to enforce, before Node/Python are involved).
# Volumetric (L3/L4) DDoS must be absorbed upstream - put a CDN/WAF such as Cloudflare in front.
# Security headers come from the apps themselves (Next.js sets a per-request nonce CSP, FastAPI
# sets API headers) so nginx does not add a second, conflicting Content-Security-Policy.

# Real client IP from the TLS proxy (Caddy) on the private docker network only.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

limit_req_zone  $binary_remote_addr zone=pages:20m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=api:20m   rate=15r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m  rate=2r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

upstream codeingo_api  { server api:8000; keepalive 16; }
upstream codeingo_next { server web:3000; keepalive 16; }

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Slowloris / oversized-request protection
    client_max_body_size        64k;
    client_body_buffer_size     16k;
    client_header_buffer_size   2k;
    large_client_header_buffers 4 8k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     15s;
    send_timeout          10s;
    limit_conn perip 30;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite - clients can't spoof their IP
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection        "";
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_send_timeout    20s;
    proxy_read_timeout    20s;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://codeingo_api;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://codeingo_api;
    }

    # Content-hashed build assets: cache hard, skip rate limiting.
    location /_next/static/ {
        proxy_pass http://codeingo_next;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        limit_req zone=pages burst=60 nodelay;
        proxy_pass http://codeingo_next;
    }

    # Never serve dotfiles or source maps
    location ~ /\.  { deny all; }
    location ~ \.map$ { deny all; }
}
