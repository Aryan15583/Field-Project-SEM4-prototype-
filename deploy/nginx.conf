# Edge web server: serves the built SPA and reverse-proxies /api to FastAPI.
# Layer-7 flood protection lives here (cheap to enforce, before Python is involved).
# Volumetric (L3/L4) DDoS must be absorbed upstream - put a CDN/WAF such as Cloudflare in front.

# Real client IP from the TLS proxy (Caddy) on the private docker network only.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

limit_req_zone  $binary_remote_addr zone=api:20m  rate=15r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Slowloris / oversized-request protection
    client_max_body_size        64k;
    client_body_buffer_size     16k;
    client_header_buffer_size   2k;
    large_client_header_buffers 4 8k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     15s;
    send_timeout          10s;
    limit_conn perip 30;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Never serve dotfiles or source maps
    location ~ /\.  { deny all; }
    location ~ \.map$ { deny all; }
}
