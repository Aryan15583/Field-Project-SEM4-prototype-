name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q
      - name: Static security analysis (bandit)
        run: bandit -q -r app -ll
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Dependency vulnerabilities (npm audit)
        run: npm audit --omit=dev --audit-level=moderate

  curriculum:
    # Executes every runnable exercise's reference solution with real toolchains and checks the
    # expected outputs (python3, node + sql.js, Chromium for HTML/CSS, javac, gcc, g++).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm install -g playwright && npx playwright install --with-deps chromium
      - run: python backend/scripts/validate_curriculum.py
