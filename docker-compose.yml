# Production stack:  internet -> caddy (TLS) -> edge (nginx: rate limits) -> web (Next.js) / api (FastAPI) -> db / redis
# Only caddy publishes ports. Everything else is on a private network.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [edge]
    networks: [edge]

  edge:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [web, api]
    networks: [edge, internal]

  web:
    build: ./frontend
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://codeingo:${POSTGRES_PASSWORD}@db:5432/codeingo
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PUBLIC_URL: https://${DOMAIN}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/api/auth/google/callback
      ALLOWED_HOSTS: '["${DOMAIN}"]'
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [internal, egress]   # egress: Google OAuth token/JWKS endpoints + optional AI API

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeingo
      POSTGRES_USER: codeingo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeingo"]
      interval: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    networks: [internal]

networks:
  edge: {}
  egress: {}
  internal: { internal: true }   # db & redis: no internet access at all

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
